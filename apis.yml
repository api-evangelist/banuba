        name: AI Talking Photo SDK — iOS sample
    description: >-
      Banuba's one hosted developer API: turns a single portrait image plus an audio track or script
      into a talking-photo video with lip-sync, facial expressions and full-body motion, rendered as an
      MP4 for apps and platforms. It is exercised publicly through a Hugging Face Space and an iOS sample
      SDK, but the HTTP reference is available only on request through Banuba Support (per the sample's
      README), so no base URL, contract or authentication scheme is recorded here.
