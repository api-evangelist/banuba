description: 'Replaces the 2026-05-04 scaffold, which invented per-minute request limits for an on-device SDK. Banuba
  documents NO HTTP rate limits: the SDKs run locally and the only hosted developer API (AI Talking Photo) has docs
  available only on request. The only published usage caps are commercial quotas — TINT plans meter virtual try-on
  sessions per month — recorded under quotas[] and cross-referenced from plans/. limit_count is therefore 0.'
