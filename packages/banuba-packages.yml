source: >-
  npm registry (registry.npmjs.org/<pkg>), pub.dev (pub.dev/api/packages/<pkg>), Banuba's own Maven Nexus
  (nexus.banuba.net/service/rest/v1/search?repository=maven-releases), the sdk-banuba GitHub org (SPM packages +
  CocoaPods specs repo), and https://docs.banuba.com/far-sdk/tutorials/development/installation — read 2026-09-17.
note: >-
  Banuba ships native SDKs, not a REST client. Every package below wraps an on-device engine (Face AR / WebAR,
  Video Editor, Photo Editor, AR Cloud) and needs a Banuba client token. Maven Central, NuGet, PyPI, RubyGems,
  crates.io and CocoaPods trunk hold nothing from Banuba: Android artifacts live on Banuba's own Nexus
  (nexus.banuba.net, maven-releases), iOS artifacts are Swift packages under github.com/sdk-banuba plus a private
  CocoaPods specs repo (github.com/sdk-banuba/banuba-sdk-podspecs). Third-party wrappers on npm/pub.dev
  (banuba-expo, expo-banuba, flutter_banuba_ar, flutter_banuba_agora_ar, react-native-agora-with-banuba) are
  listed as official:false.
