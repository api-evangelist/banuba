note: >-
  Banuba has no separate sandbox environment or test-mode credentials: the same SDK binaries run in trial and in
  production, and the mode is decided by which client token is loaded. What it publishes instead is a demo-token
  mode plus hosted, no-signup demos of each product. No test values are invented here — there are none to publish.
modes:
  - mode: demo
    credential: demo client token (.txt), requested via the website form or a sales manager
    validity: 14 days (standard trial); renewable on request if evaluation was not finished
    scope: activates ALL SDK features for evaluation
    after_expiry: one month with Banuba watermark + screen blur, then the SDK stops working
    rule: never ship a demo token in a live app
  - mode: commercial
    credential: commercial client token issued by the account manager after payment
    validity: the prepaid licence period; auto-renews while in use
    scope: the feature set / platforms defined by the licence
