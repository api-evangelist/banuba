description: 'Plans and pricing Banuba actually publishes, replacing the 2026-05-04 scaffold. Two different models:
  (1) the SDKs (Face AR, Video Editor, Photo Editor) are licensed on a custom, MAU-based quote with no public price
  list — three factors set the quote (platforms shipped on, feature categories activated, monthly active users),
  a 14-day free trial token is offered, and there is no per-developer seat fee; (2) the TINT virtual try-on product
  publishes six priced self-serve plans — three for the no-code Easy Virtual Try-On platform (app.tintvto.com) and
  three for the Shopify app — metered by virtual try-on sessions per month. Custom enterprise TINT integrations
  (WooCommerce, Wix, Cafe24, Shoptet, OpenCart, native apps) are priced per try-on on request.'
plan_count: 6
